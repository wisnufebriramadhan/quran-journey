name: quran_tracker
description: A Quran reading tracker & prayer time app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0

  # Calendar
  table_calendar: ^3.1.2

  # State management
  provider: ^6.1.2

  # Storage
  flutter_secure_storage: ^9.0.0

  # UI & Utils
  intl: ^0.19.0

  # Prayer time & location
  adhan: ^2.0.0
  geolocator: 12.0.0
  geocoding: ^3.0.0

  # Hijri date
  hijri: ^3.0.0

  # Shared Preferences
  shared_preferences: ^2.1.1

  # Audio playback
  just_audio: ^0.9.36
  audio_session: ^0.1.19

  # HTTP
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

dependency_overrides:
  geolocator_android: 4.5.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
