name: Build & Release Quran Journey APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java (Android build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter (LOCK VERSION)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: false

      # Show version (debug)
      - name: Flutter version
        run: flutter --version

      # Get app version from pubspec.yaml
      - name: Get app version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Dependencies
      - name: Install dependencies
        run: flutter pub get

      # Clean
      - name: Flutter clean
        run: flutter clean

      # Build SPLIT APK
      - name: Build split APK
        run: flutter build apk --release --split-per-abi

      # Rename APK files
      - name: Rename APKs
        run: |
          mkdir release-apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apk/quran-journey-v${{ steps.app_version.outputs.version }}-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apk/quran-journey-v${{ steps.app_version.outputs.version }}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-universal-release.apk release-apk/quran-journey-v${{ steps.app_version.outputs.version }}-universal.apk

      # Upload artifact (backup)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-journey-apk
          path: release-apk/

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Quran Journey v${{ steps.app_version.outputs.version }}
          files: release-apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
